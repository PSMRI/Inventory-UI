<app-header [showRoles]="false"></app-header>

<div
  class="flex min-h-[calc(100svh-3rem)] items-center justify-center px-6 py-10"
>
  <z-card
    class="w-full max-w-lg animate-in fade-in-0 slide-in-from-bottom-2 duration-300 motion-reduce:animate-none"
  >
    <z-card-header class="flex flex-col items-center gap-1.5 text-center">
      <z-card-title>Select Service</z-card-title>
      <z-card-description>Click on a service to proceed</z-card-description>
    </z-card-header>

    <z-card-content>
      <div class="flex flex-wrap justify-center gap-4">
        <button
          z-button
          zType="default"
          type="button"
          *ngFor="let service of servicesList"
          (click)="selectService(service)"
          [attr.aria-label]="service.serviceName"
          class="h-auto min-h-36 max-w-80 flex-1 basis-72 px-7 py-6"
        >
          <ng-icon name="lucideStore" size="80" aria-hidden="true"></ng-icon>
        </button>
      </div>
    </z-card-content>
  </z-card>
</div>
