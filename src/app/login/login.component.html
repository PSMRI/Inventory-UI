<div
  class="flex min-h-svh w-full flex-col items-center justify-center gap-6 bg-muted p-6 md:p-10"
>
  <z-card class="w-full max-w-sm">
    <z-card-header class="flex flex-col items-center gap-1.5 text-center">
      <img
        class="mb-2 h-12 w-auto"
        src="assets/images/Swasthya.png"
        alt="Piramal Swasthya"
      />
      <z-card-title>AMRIT Inventory</z-card-title>
      <z-card-description
        >Sign in to your account to continue</z-card-description
      >
    </z-card-header>

    <z-card-content>
      <form
        class="grid gap-6"
        (ngSubmit)="f.form.valid && login()"
        #f="ngForm"
        autocomplete="off"
      >
        <z-form-field>
          <label z-form-label zRequired for="userID">User Name</label>
          <z-form-control>
            <div class="relative">
              <ng-icon
                class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground"
                name="lucideUser"
                size="18"
                aria-hidden="true"
              ></ng-icon>
              <input
                z-input
                class="w-full pl-9"
                required
                autocomplete="off"
                allowText="usernameValidator"
                type="text"
                id="userID"
                [(ngModel)]="userName"
                name="userName"
                #userNameCtrl="ngModel"
                placeholder="Enter user name"
              />
            </div>
          </z-form-control>
          <z-form-message *ngIf="userNameCtrl.touched && userNameCtrl.invalid"
            >User name is required.</z-form-message
          >
        </z-form-field>

        <z-form-field>
          <label z-form-label zRequired for="password">Password</label>
          <z-form-control>
            <div class="relative">
              <ng-icon
                class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground"
                name="lucideLock"
                size="18"
                aria-hidden="true"
              ></ng-icon>
              <input
                z-input
                class="w-full pl-9 pr-10"
                required
                autocomplete="off"
                [type]="dynamictype"
                id="password"
                [(ngModel)]="password"
                name="password"
                #passwordCtrl="ngModel"
                placeholder="Enter password"
              />
              <button
                type="button"
                class="absolute right-3 top-1/2 inline-flex -translate-y-1/2 items-center justify-center appearance-none border-0 bg-transparent p-0 text-muted-foreground transition-colors hover:text-foreground focus-visible:outline-none focus-visible:text-foreground"
                aria-label="Show password while pressed"
                (mousedown)="showPWD()"
                (touchstart)="showPWD()"
                (mouseup)="hidePWD()"
                (touchend)="showPWD()"
              >
                <ng-icon
                  [name]="dynamictype === 'text' ? 'lucideEyeOff' : 'lucideEye'"
                  size="18"
                ></ng-icon>
              </button>
            </div>
          </z-form-control>
          <z-form-message *ngIf="passwordCtrl.touched && passwordCtrl.invalid"
            >Password is required.</z-form-message
          >
        </z-form-field>

        <fieldset
          *ngIf="enableCaptcha"
          class="m-0 flex min-w-0 justify-center border-0 p-0"
        >
          <legend class="sr-only">Security check</legend>
          <app-captcha
            #captchaCmp
            (tokenResolved)="onCaptchaResolved($event)"
          ></app-captcha>
        </fieldset>

        <a
          class="-mt-2 ml-auto inline-block text-sm font-medium text-primary underline-offset-4 hover:underline"
          routerLink="/reset-password"
          >Forgot Password?</a
        >

        <button
          z-button
          type="submit"
          zType="default"
          zFull
          [disabled]="
            (enableCaptcha && (!captchaToken || f.form.invalid)) ||
            (!enableCaptcha && f.form.invalid)
          "
        >
          Login
        </button>
      </form>
    </z-card-content>
  </z-card>
</div>

<app-footer></app-footer>
