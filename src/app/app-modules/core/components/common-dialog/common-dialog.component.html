<!-- Shared header: status icon + title, colored by status (info/success/warn/error) -->
<ng-template #dialogHeader let-status="status" let-text="text">
  <div
    class="flex items-center gap-2"
    [ngClass]="
      status === 'success'
        ? 'text-success'
        : status === 'warn' || status === 'warning'
          ? 'text-warning'
          : status === 'error' || status === 'fail'
            ? 'text-destructive'
            : 'text-info'
    "
  >
    <ng-icon
      size="20"
      [name]="
        status === 'success'
          ? 'lucideCircleCheck'
          : status === 'warn' || status === 'warning'
            ? 'lucideTriangleAlert'
            : status === 'error' || status === 'fail'
              ? 'lucideCircleX'
              : 'lucideInfo'
      "
    ></ng-icon>
    <p class="m-0 text-base font-semibold">{{ text }}</p>
  </div>
</ng-template>

<!-- Confirm -->
<div *ngIf="confirmAlert" class="flex flex-col gap-4 p-6">
  <ng-container
    *ngTemplateOutlet="dialogHeader; context: { status: 'info', text: title }"
  ></ng-container>
  <p class="m-0 text-sm text-muted-foreground">{{ message }}</p>
  <div class="flex justify-end gap-2">
    <button z-button zType="outline" (click)="dialogRef.close(false)">
      {{ btnCancelText }}
    </button>
    <button
      z-button
      zType="default"
      (click)="dialogRef.close(true)"
      cdkFocusInitial
    >
      {{ btnOkText }}
    </button>
  </div>
</div>

<!-- Alert (single acknowledge button) -->
<div *ngIf="alert" class="flex flex-col gap-4 p-6">
  <ng-container
    *ngTemplateOutlet="
      dialogHeader;
      context: {
        status: status,
        text: (status === 'warn' ? 'warning' : status) | titlecase,
      }
    "
  ></ng-container>
  <p class="m-0 text-sm text-muted-foreground">{{ message }}</p>
  <div class="flex justify-end gap-2">
    <button
      z-button
      zType="default"
      (click)="dialogRef.close()"
      cdkFocusInitial
    >
      {{ btnOkText }}
    </button>
  </div>
</div>

<!-- Remarks (single-line) -->
<div *ngIf="remarks" class="flex flex-col gap-4 p-6">
  <ng-container
    *ngTemplateOutlet="dialogHeader; context: { status: 'info', text: message }"
  ></ng-container>
  <input
    z-input
    autocomplete="off"
    placeholder="{{ currentLanguageSet?.inventory?.enterRemarks }}"
    [attr.aria-label]="currentLanguageSet?.inventory?.enterRemarks"
    name="Remarks"
    #remarksRef
  />
  <div class="flex justify-end gap-2">
    <button z-button zType="outline" (click)="dialogRef.close(false)">
      {{ btnCancelText }}
    </button>
    <button
      z-button
      zType="default"
      (click)="dialogRef.close(remarksRef.value)"
    >
      {{ btnOkText }}
    </button>
  </div>
</div>

<!-- Edit remarks (multi-line) -->
<div *ngIf="editRemarks" class="flex flex-col gap-4 p-6">
  <ng-container
    *ngTemplateOutlet="dialogHeader; context: { status: 'info', text: message }"
  ></ng-container>
  <textarea
    z-input
    class="min-h-20"
    placeholder="{{ currentLanguageSet?.inventory?.enterRemarks }}"
    [attr.aria-label]="currentLanguageSet?.inventory?.enterRemarks"
    name="Remarks"
    maxLength="500"
    #remarksRef
    [(ngModel)]="comments"
  ></textarea>
  <div class="flex justify-end gap-2">
    <button z-button zType="outline" (click)="dialogRef.close(false)">
      {{ btnCancelText }}
    </button>
    <button
      z-button
      zType="default"
      (click)="dialogRef.close(remarksRef.value + '.')"
    >
      {{ btnOkText }}
    </button>
  </div>
</div>

<!-- Draft description -->
<div *ngIf="provideDraftDesc" class="flex flex-col gap-4 p-6">
  <ng-container
    *ngTemplateOutlet="dialogHeader; context: { status: 'info', text: message }"
  ></ng-container>
  <z-form-field>
    <label z-form-label for="dialog-draft-desc">{{
      currentLanguageSet?.inventory?.provideDraftDesc
    }}</label>
    <z-form-control>
      <textarea
        z-input
        class="min-h-20"
        id="dialog-draft-desc"
        name="draftDescription"
        maxLength="500"
        [value]="comments"
        #draftDescription
      ></textarea>
    </z-form-control>
  </z-form-field>
  <div class="flex justify-end gap-2">
    <button z-button zType="outline" (click)="dialogRef.close(comments)">
      {{ btnCancelText }}
    </button>
    <button
      z-button
      zType="default"
      (click)="dialogRef.close(draftDescription.value)"
    >
      {{ btnOkText }}
    </button>
  </div>
</div>

<!-- Notify (mandatory-fields list) -->
<div *ngIf="notify" class="flex flex-col gap-4 p-6">
  <ng-container
    *ngTemplateOutlet="dialogHeader; context: { status: 'warn', text: message }"
  ></ng-container>
  <ul class="flex flex-col gap-1">
    <li
      class="flex items-center gap-2 rounded-md bg-destructive/10 px-3 py-1.5 text-sm text-destructive"
      *ngFor="let items of mandatories"
    >
      <ng-icon name="lucideChevronRight" size="16"></ng-icon>
      <span class="font-semibold">{{ items | titlecase }}</span>
    </li>
  </ul>
  <div class="flex justify-end gap-2">
    <button
      z-button
      zType="default"
      (click)="dialogRef.close(true)"
      cdkFocusInitial
    >
      {{ btnOkText }}
    </button>
  </div>
</div>

<!-- Choice (radio) -->
<div *ngIf="choice" class="flex flex-col gap-4 p-6">
  <ng-container
    *ngTemplateOutlet="dialogHeader; context: { status: 'info', text: message }"
  ></ng-container>
  <z-radio-group [(ngModel)]="selectedValue" class="gap-2">
    <z-radio *ngFor="let value of values" [value]="value.id">
      {{ value.name }}
    </z-radio>
  </z-radio-group>
  <div class="flex justify-end gap-2">
    <button z-button zType="outline" (click)="dialogRef.close(false)">
      {{ btnCancelText }}
    </button>
    <button
      z-button
      zType="default"
      (click)="dialogRef.close(selectedValue)"
      cdkFocusInitial
    >
      {{ btnOkText }}
    </button>
  </div>
</div>

<!-- Session timeout -->
<div *ngIf="sessionTimeout" class="flex flex-col gap-4 p-6">
  <ng-container
    *ngTemplateOutlet="dialogHeader; context: { status: 'warn', text: title }"
  ></ng-container>
  <p class="m-0 text-sm text-muted-foreground">
    <span>{{ message }} &nbsp;</span>
    <small>
      <span *ngIf="minutes >= 1"
        >{{ minutes.toFixed(0) }} &nbsp; minutes &nbsp;</span
      >
      <span *ngIf="seconds > 0">{{ seconds }} &nbsp; seconds</span>
    </small>
  </p>
  <div class="flex justify-end gap-2">
    <button z-button zType="outline" (click)="stopTimer()">
      {{ btnCancelText }}
    </button>
    <button
      z-button
      zType="default"
      (click)="continueSession()"
      cdkFocusInitial
    >
      {{ btnOkText }}
    </button>
  </div>
</div>
