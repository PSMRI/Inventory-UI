<header
  class="flex min-h-12 flex-wrap items-center justify-between gap-4 border-border bg-background px-6 py-1.5"
  [class.border-b]="!showRoles">
  <a class="inline-flex items-center" aria-label="Piramal Swasthya">
    <img class="h-8 w-auto" src="assets/images/logo.png" alt="Logo" />
  </a>

  <div class="flex flex-wrap items-center justify-end gap-2">
    <!-- Language -->
    <div *ngIf="isAuthenticated" class="inline-flex items-center gap-2">
      <span class="text-sm text-muted-foreground"
        >{{ currentLanguageSet?.inventory?.selectLanguage }} :</span
      >
      <z-select
        class="w-36"
        name="language"
        [(ngModel)]="language"
        (zSelectionChange)="changeLanguage(language)">
        <z-select-item
          *ngFor="let language of languageArray"
          [zValue]="language.languageName">
          {{ language.languageName }}
        </z-select-item>
      </z-select>
    </div>

    <!-- User (name + designation menu) -->
    <button
      *ngIf="userName"
      z-button
      zType="ghost"
      type="button"
      class="text-sm"
      [zMenuTriggerFor]="userInfo"
      [zTooltip]="currentLanguageSet?.inventory?.user || 'User'"
      zPosition="bottom">
      <ng-icon class="text-muted-foreground" name="lucideCircleUser"></ng-icon>
      <span class="text-muted-foreground">{{
        currentLanguageSet?.inventory?.welcome
      }}</span>
      <span class="font-semibold text-foreground">{{
        userName | titlecase
      }}</span>
    </button>
    <z-menu #userInfo="zMenu">
      <button z-menu-item type="button" *ngIf="userName">
        <ng-icon name="lucideCircleUser" size="16"></ng-icon>
        {{ userName | titlecase }}
      </button>
      <button z-menu-item type="button" *ngIf="designation">
        <ng-icon name="lucideBriefcase" size="16"></ng-icon>
        {{ designation | titlecase }}
      </button>
    </z-menu>

    <!-- Help -->
    <button
      *ngIf="isAuthenticated"
      z-button
      zType="ghost"
      zSize="icon-lg"
      type="button"
      class="text-muted-foreground"
      [zMenuTriggerFor]="knowAboutUs"
      [zTooltip]="currentLanguageSet?.inventory?.help || 'Help'"
      [attr.aria-label]="currentLanguageSet?.inventory?.help || 'Help'"
      zPosition="bottom">
      <ng-icon name="lucideCircleHelp"></ng-icon>
    </button>
    <z-menu #knowAboutUs="zMenu">
      <button z-menu-item type="button" (click)="showVersionAndCommitDetails()">
        <ng-icon name="lucideInfo" size="16"></ng-icon>
        {{ currentLanguageSet?.inventory?.version }} : {{ versionUI }}
      </button>
      <a
        z-menu-item
        target="_blank"
        rel="noopener noreferrer"
        href="{{ license }}"
        class="no-underline">
        <ng-icon name="lucideFileText" size="16"></ng-icon>
        {{ currentLanguageSet?.inventory?.licenseInfo }}
      </a>
    </z-menu>

    <!-- Store -->
    <a
      *ngIf="providerServiceID && !isExternal && storeName"
      class="inline-flex cursor-pointer items-center gap-1.5 rounded-md px-2 py-1 text-sm transition-colors hover:bg-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
      [routerLink]="'/facility'"
      [zTooltip]="currentLanguageSet?.inventory?.storeSelection || 'Store'"
      zPosition="bottom">
      <ng-icon
        class="text-muted-foreground"
        name="lucideStore"
        size="20"></ng-icon>
      <span class="text-muted-foreground"
        >{{ currentLanguageSet?.inventory?.store }}:</span
      >
      <span class="font-semibold text-foreground">{{
        storeName | titlecase
      }}</span>
    </a>

    <!-- Logout -->
    <button
      *ngIf="isAuthenticated && !isExternal"
      z-button
      zType="ghost"
      zSize="icon-lg"
      type="button"
      class="text-destructive"
      [zTooltip]="currentLanguageSet?.inventory?.logout || 'Log out'"
      [attr.aria-label]="currentLanguageSet?.inventory?.logout || 'Log out'"
      zPosition="bottom"
      (click)="logout()">
      <ng-icon name="lucidePower"></ng-icon>
    </button>
  </div>
</header>

<!-- Role navigation -->
<nav
  *ngIf="showRoles && !isExternal"
  class="flex flex-wrap items-center gap-1 border-b border-border bg-background px-6 py-1">
  <ng-container *ngFor="let item of navigation">
    <ng-container *ngIf="item.role !== 'isExternal'">
      <button
        z-button
        zType="ghost"
        type="button"
        class="text-sm font-medium text-muted-foreground hover:text-foreground"
        [zMenuTriggerFor]="items">
        {{ item.role }}
        <ng-icon name="lucideChevronDown"></ng-icon>
      </button>
      <z-menu #items="zMenu">
        <button
          z-menu-item
          type="button"
          *ngFor="let value of item.work"
          [routerLink]="[value.link]"
          routerLinkActive="bg-accent text-accent-foreground">
          {{ value.label }}
        </button>
      </z-menu>
    </ng-container>
    <button
      *ngIf="item.role === 'isExternal'"
      z-button
      zType="ghost"
      type="button"
      class="text-sm font-medium text-muted-foreground hover:text-foreground"
      (click)="backToParent()">
      {{ currentLanguageSet?.itemDispense?.pharmacist }}
    </button>
  </ng-container>
</nav>

<nav
  *ngIf="showRoles && isExternal"
  class="flex flex-wrap items-center gap-1 border-b border-border bg-background px-6 py-1">
  <button
    z-button
    zType="ghost"
    type="button"
    class="text-sm font-medium text-muted-foreground hover:text-foreground"
    (click)="backToParent()">
    {{ currentLanguageSet?.itemDispense?.pharmacist }}
  </button>
</nav>
