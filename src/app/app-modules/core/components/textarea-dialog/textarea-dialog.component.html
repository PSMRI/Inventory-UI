<div class="flex flex-col gap-1.5 p-6">
  <textarea
    z-input
    class="min-h-32 w-full"
    #message
    [maxlength]="data.length"
    placeholder="{{ currentLanguageSet?.inventory?.typeyourdata }}"
    [attr.aria-label]="currentLanguageSet?.inventory?.typeyourdata"
    [(ngModel)]="data.observations"
  ></textarea>
  <p class="m-0 text-right text-xs text-muted-foreground">
    {{ message.value.length }} / {{ data.length }}
  </p>
</div>
