<div class="px-6 pb-10 pt-4">
  <p class="text-xl font-semibold tracking-tight text-foreground">
    {{ currentLanguageSet?.inventory?.dailyStockSummaryReport }}
  </p>

  <z-card class="mt-4">
    <z-card-content>
      <form
        [formGroup]="dailyStockSummaryForm"
        class="grid gap-4 md:grid-cols-2 lg:grid-cols-3"
      >
        <z-form-field class="gap-1.5">
          <label z-form-label zRequired for="startDate">
            {{ currentLanguageSet?.inventory?.startDate }}
          </label>
          <z-form-control>
            <z-date-picker
              id="startDate"
              class="w-full"
              formControlName="startDate"
              zFormat="dd/MM/yyyy"
              [placeholder]="currentLanguageSet?.inventory?.startDate || ''"
              [maxDate]="maxEndDate"
              (dateChange)="checkEndDate({ value: $event })"
            />
          </z-form-control>
        </z-form-field>

        <z-form-field class="gap-1.5">
          <label z-form-label zRequired for="endDate">
            {{ currentLanguageSet?.inventory?.endDate }}
          </label>
          <z-form-control>
            <z-date-picker
              id="endDate"
              class="w-full"
              formControlName="endDate"
              zFormat="dd/MM/yyyy"
              [placeholder]="currentLanguageSet?.inventory?.endDate || ''"
              [minDate]="minEndDate"
              [maxDate]="maxEndDate"
              (dateChange)="checkStartDate({ value: $event })"
            />
          </z-form-control>
        </z-form-field>

        <z-form-field class="gap-1.5">
          <label z-form-label zRequired for="facilityName">
            {{ currentLanguageSet?.inventory?.facility }}
          </label>
          <z-form-control>
            <z-select
              id="facilityName"
              class="w-full"
              formControlName="facilityName"
              [zPlaceholder]="currentLanguageSet?.inventory?.facility || ''"
            >
              <z-select-item *ngFor="let item of facilities" [zValue]="item">
                {{ item }}
              </z-select-item>
            </z-select>
          </z-form-control>
        </z-form-field>
      </form>

      <div class="mt-2 flex justify-end">
        <button
          z-button
          zType="outline"
          type="button"
          [disabled]="!dailyStockSummaryForm.valid"
          (click)="downloadReport(true)"
        >
          <ng-icon name="lucideDownload"></ng-icon>
          {{ currentLanguageSet?.inventory?.download }}
        </button>
      </div>
    </z-card-content>
  </z-card>
</div>
