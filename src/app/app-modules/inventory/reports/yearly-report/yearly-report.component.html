<div class="px-6 pb-10 pt-4">
  <p class="text-xl font-semibold tracking-tight text-foreground">
    {{ currentLanguageSet?.inventory?.yearlyReport }}
  </p>

  <z-card class="mt-4">
    <z-card-content>
      <form
        [formGroup]="yearlyForm"
        class="grid gap-4 md:grid-cols-2 lg:grid-cols-3"
      >
        <z-form-field class="gap-1.5">
          <label z-form-label zRequired for="year">
            {{ currentLanguageSet?.inventory?.selectyear }}
          </label>
          <z-form-control>
            <z-select
              id="year"
              class="w-full"
              [zPlaceholder]="currentLanguageSet?.inventory?.selectyear || ''"
              (zSelectionChange)="
                yearlyForm.controls['year'].setValue($any($event) * 1)
              "
            >
              <z-select-item
                *ngFor="let year of years"
                [zValue]="year.toString()"
              >
                {{ year }}
              </z-select-item>
            </z-select>
          </z-form-control>
        </z-form-field>

        <z-form-field class="gap-1.5">
          <label z-form-label zRequired for="facilityName">
            {{ currentLanguageSet?.inventory?.facility }}
          </label>
          <z-form-control>
            <z-select
              id="facilityName"
              class="w-full"
              formControlName="facilityName"
              [zPlaceholder]="currentLanguageSet?.inventory?.facility || ''"
            >
              <z-select-item *ngFor="let item of facilities" [zValue]="item">
                {{ item }}
              </z-select-item>
            </z-select>
          </z-form-control>
        </z-form-field>
      </form>

      <div class="mt-2 flex justify-end">
        <button
          z-button
          zType="outline"
          type="button"
          [disabled]="!yearlyForm.valid"
          (click)="downloadReport(true)"
        >
          <ng-icon name="lucideDownload"></ng-icon>
          {{ currentLanguageSet?.inventory?.download }}
        </button>
      </div>
    </z-card-content>
  </z-card>
</div>
