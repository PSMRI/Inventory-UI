<div class="px-6 pb-10 pt-4">
  <p class="text-xl font-semibold tracking-tight text-foreground">
    {{ currentLanguageSet?.inventory?.shortExpiryReport }}
  </p>

  <z-card class="mt-4">
    <z-card-content>
      <form
        [formGroup]="shortExpiryForm"
        class="grid gap-4 md:grid-cols-2 lg:grid-cols-3"
      >
        <z-form-field class="gap-1.5">
          <label z-form-label for="startDate">
            {{ currentLanguageSet?.inventory?.date }}
          </label>
          <z-form-control>
            <z-date-picker
              id="startDate"
              class="w-full"
              [value]="shortExpiryForm.value.startDate"
              [disabled]="true"
              zFormat="dd/MM/yyyy"
              [placeholder]="currentLanguageSet?.inventory?.date || ''"
              [maxDate]="maxEndDate"
            />
          </z-form-control>
        </z-form-field>
      </form>

      <div class="mt-2 flex justify-end">
        <button
          z-button
          zType="outline"
          type="button"
          (click)="downloadReport(true)"
        >
          <ng-icon name="lucideDownload"></ng-icon>
          {{ currentLanguageSet?.inventory?.download }}
        </button>
      </div>
    </z-card-content>
  </z-card>
</div>
