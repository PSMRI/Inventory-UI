<div class="px-6 pb-10 pt-4">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <p class="m-0 text-xl font-semibold tracking-tight text-foreground">
      {{ currentLanguageSet?.inventory?.patientIssueWithoutRx }}
    </p>
    <div class="flex flex-wrap gap-2">
      <button z-button zType="outline" type="button" routerLink="View">
        {{ currentLanguageSet?.inventory?.previousRecords }}
      </button>
      <button
        z-button
        zType="default"
        type="button"
        (click)="openSearchDialog()"
      >
        {{ currentLanguageSet?.bendetails?.advanceSearch }}
      </button>
    </div>
  </div>

  <z-card class="mt-4">
    <z-card-content>
      <form
        [formGroup]="beneficiaryDetailForm"
        autocomplete="off"
        novalidate
        class="grid gap-4 md:grid-cols-2 lg:grid-cols-4"
      >
        <z-form-field class="gap-1.5">
          <label z-form-label for="beneficiaryID">{{
            currentLanguageSet?.bendetails?.beneficiaryID
          }}</label>
          <z-form-control>
            <input
              z-input
              class="w-full"
              appDefaultNull
              allowText="number"
              maxlength="12"
              name="beneficiaryID"
              id="beneficiaryID"
              formControlName="beneficiaryID"
              (keyup)="checkBeneficiary()"
              placeholder="{{ currentLanguageSet?.bendetails?.beneficiaryID }}"
            />
          </z-form-control>
        </z-form-field>

        <z-form-field class="gap-1.5">
          <label z-form-label for="visitInvCode"
            >{{ currentLanguageSet?.itemDispense?.visitcode }}:</label
          >
          <z-form-control>
            <z-select
              id="visitInvCode"
              class="w-full"
              name="visitCode"
              [zPlaceholder]="currentLanguageSet?.itemDispense?.visitcode || ''"
              [zDisabled]="!beneficiaryDetailForm.get('beneficiaryID')?.value"
              [zValue]="
                beneficiaryDetail &&
                beneficiaryDetailForm.controls['visitCode'].value
                  ? beneficiaryDetail
                      .indexOf(
                        beneficiaryDetailForm.controls['visitCode'].value
                      )
                      .toString()
                  : ''
              "
              (zSelectionChange)="
                beneficiaryDetailForm.patchValue({
                  visitCode: beneficiaryDetail[$any($event)],
                });
                getVisitDetail()
              "
            >
              <z-select-item
                *ngFor="let visit of beneficiaryDetail; let i = index"
                [zValue]="i.toString()"
              >
                {{ visit.benVisitCode }}
              </z-select-item>
            </z-select>
          </z-form-control>
        </z-form-field>

        <z-form-field class="gap-1.5">
          <label z-form-label for="visitDate">{{
            currentLanguageSet?.bendetails?.visitDate
          }}</label>
          <z-form-control>
            <z-date-picker
              id="visitDate"
              class="w-full"
              zFormat="dd/MM/yyyy"
              [placeholder]="currentLanguageSet?.bendetails?.visitDate || ''"
              formControlName="visitDate"
            />
          </z-form-control>
        </z-form-field>

        <z-form-field class="gap-1.5">
          <label z-form-label for="beneficiaryName">{{
            currentLanguageSet?.inventory?.patientName
          }}</label>
          <z-form-control>
            <input
              z-input
              class="w-full"
              appDefaultNull
              allowText="alphaspace"
              name="beneficiaryName"
              id="beneficiaryName"
              formControlName="beneficiaryName"
              [readonly]="true"
              placeholder="{{ currentLanguageSet?.inventory?.patientName }}"
            />
          </z-form-control>
        </z-form-field>

        <z-form-field class="gap-1.5">
          <label z-form-label for="beneficiaryAge">{{
            currentLanguageSet?.bendetails?.age
          }}</label>
          <z-form-control>
            <input
              z-input
              class="w-full"
              appDefaultNull
              allowText="number"
              name="beneficiaryAge"
              id="beneficiaryAge"
              formControlName="beneficiaryAge"
              [readonly]="true"
              placeholder="{{ currentLanguageSet?.bendetails?.age }}"
            />
          </z-form-control>
        </z-form-field>

        <z-form-field class="gap-1.5">
          <label z-form-label for="genderName">{{
            currentLanguageSet?.bendetails?.gender
          }}</label>
          <z-form-control>
            <input
              z-input
              class="w-full"
              appDefaultNull
              allowText="alphabet"
              name="genderName"
              id="genderName"
              formControlName="genderName"
              [readonly]="true"
              placeholder="{{ currentLanguageSet?.bendetails?.gender }}"
            />
          </z-form-control>
        </z-form-field>

        <z-form-field class="gap-1.5">
          <label z-form-label for="doctorName">{{
            currentLanguageSet?.inventory?.doctorName
          }}</label>
          <z-form-control>
            <input
              z-input
              class="w-full"
              appDefaultNull
              allowText="alphaspace"
              name="doctorName"
              id="doctorName"
              formControlName="doctorName"
              [readonly]="true"
              placeholder="{{ currentLanguageSet?.inventory?.doctorName }}"
            />
          </z-form-control>
        </z-form-field>

        <z-form-field class="gap-1.5">
          <label z-form-label for="reference">{{
            currentLanguageSet?.inventory?.remarks
          }}</label>
          <z-form-control>
            <input
              z-input
              class="w-full"
              appDefaultNull
              allowText="alphanumericspace"
              name="reference"
              id="reference"
              formControlName="reference"
              maxlength="50"
              [readonly]="!dateBool"
              placeholder="{{ currentLanguageSet?.inventory?.remarks }}"
            />
          </z-form-control>
        </z-form-field>

        <div class="flex flex-col gap-2 md:col-span-2 lg:col-span-4">
          <label z-form-label for="medicineDispenseType"
            >{{ currentLanguageSet?.inventory?.typeofDispense }}:</label
          >
          <z-radio-group
            id="medicineDispenseType"
            name="medicineDispenseType"
            zOrientation="horizontal"
            class="flex-wrap gap-4"
            [ngModel]="
              beneficiaryDetailForm.controls['medicineDispenseType'].value
            "
            [ngModelOptions]="{ standalone: true }"
            [disabled]="!beneficiaryDetailForm.get('visitCode')?.value"
            (zChange)="
              beneficiaryDetailForm.patchValue({
                medicineDispenseType: $event,
              });
              getBeneficiaryDetail()
            "
          >
            <z-radio value="Manual">{{
              currentLanguageSet?.inventory?.manualDispense
            }}</z-radio>
            <z-radio value="System">{{
              currentLanguageSet?.inventory?.systemDispense
            }}</z-radio>
          </z-radio-group>
        </div>
      </form>

      <app-system-medicine-dispense
        [beneficaryDetail]="beneficaryDetail"
        (resetBeneficiaryDetail)="resetBeneficiaryDetails($event)"
        *ngIf="
          this.beneficiaryDetailForm.controls['medicineDispenseType'].value ===
          'System'
        "
      ></app-system-medicine-dispense>
      <app-manual-medicine-dispense
        [beneficaryDetail]="beneficaryDetail"
        (resetBeneficiaryDetail)="resetBeneficiaryDetails($event)"
        *ngIf="
          this.beneficiaryDetailForm.controls['medicineDispenseType'].value ===
          'Manual'
        "
      ></app-manual-medicine-dispense>
    </z-card-content>
  </z-card>
</div>
