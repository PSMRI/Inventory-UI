<div
  class="flex items-center justify-between gap-2 border-b border-border px-6 py-4"
>
  <p id="dialog_head" class="m-0 text-lg font-semibold text-foreground">
    {{ currentLanguageSet?.inventory?.reasonForReject }}
  </p>
  <button
    z-button
    zType="ghost"
    zSize="icon-sm"
    type="button"
    [zTooltip]="currentLanguageSet?.inventory?.close"
    [attr.aria-label]="currentLanguageSet?.inventory?.close || 'Close'"
    (click)="dialogRef.close()"
  >
    <ng-icon name="lucideX"></ng-icon>
  </button>
</div>

<div class="p-6">
  <form [formGroup]="rejectRequestForm" autocomplete="off">
    <z-form-field class="gap-1.5">
      <label z-form-label zRequired for="rejectReason">{{
        currentLanguageSet?.inventory?.reason
      }}</label>
      <z-form-control>
        <input
          z-input
          class="w-full"
          id="rejectReason"
          required="true"
          allowText="alphanumericspace"
          maxlength="250"
          formControlName="rejectReason"
          placeholder="{{ currentLanguageSet?.inventory?.reason }}"
        />
      </z-form-control>
    </z-form-field>
  </form>

  <div class="mt-5 flex justify-end">
    <button
      z-button
      zType="default"
      type="button"
      tabindex="-1"
      [disabled]="rejectRequestForm.invalid"
      (click)="rejectIndentRequest()"
    >
      {{ currentLanguageSet?.common?.ok }}
    </button>
  </div>
</div>
