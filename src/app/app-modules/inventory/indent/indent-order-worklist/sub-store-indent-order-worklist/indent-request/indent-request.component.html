<section class="px-6 pb-10 pt-4">
  <p class="m-0 text-xl font-semibold tracking-tight text-foreground">
    {{ currentLanguageSet?.inventory?.indentRequest }}
  </p>

  <form [formGroup]="indentRequestForm" autocomplete="off">
    <div class="mt-4 grid gap-4 md:grid-cols-2 lg:grid-cols-4">
      <z-form-field class="gap-1.5">
        <label z-form-label for="requestDate">{{
          currentLanguageSet?.inventory?.indentDate
        }}</label>
        <z-form-control>
          <z-date-picker
            id="requestDate"
            class="w-full"
            zFormat="dd/MM/yyyy"
            [placeholder]="currentLanguageSet?.inventory?.indentDate || ''"
            name="requestDate"
            formControlName="requestDate"
            [disabled]="true"
          />
        </z-form-control>
      </z-form-field>

      <z-form-field class="gap-1.5">
        <label z-form-label zRequired for="referenceNumber">{{
          currentLanguageSet?.inventory?.referenceNo
        }}</label>
        <z-form-control>
          <input
            z-input
            class="w-full"
            id="referenceNumber"
            required="true"
            allowText="alphanumeric"
            maxlength="20"
            formControlName="referenceNumber"
            placeholder="{{ currentLanguageSet?.inventory?.referenceNo }}"
          />
        </z-form-control>
      </z-form-field>

      <z-form-field class="gap-1.5">
        <label z-form-label zRequired for="indentReason">{{
          currentLanguageSet?.inventory?.reason
        }}</label>
        <z-form-control>
          <input
            z-input
            class="w-full"
            id="indentReason"
            required="true"
            allowText="alphanumericspace"
            maxlength="250"
            formControlName="indentReason"
            placeholder="{{ currentLanguageSet?.inventory?.reason }}"
          />
        </z-form-control>
      </z-form-field>
    </div>

    <z-card class="mt-4">
      <z-card-content class="p-2">
        <div class="w-full overflow-x-auto">
          <ng-container formArrayName="indentItemList"></ng-container>
          <table z-table aria-describedby="indentItemList">
            <thead z-table-header>
              <tr z-table-row>
                <th z-table-head></th>
                <th z-table-head class="min-w-52">
                  {{ currentLanguageSet?.inventory?.itemName }}
                </th>
                <th z-table-head class="min-w-28">
                  {{ currentLanguageSet?.inventory?.quantityOnHand }}
                </th>
                <th z-table-head class="min-w-28">
                  {{ currentLanguageSet?.inventory?.requiredQuantity }}
                </th>
                <th z-table-head class="min-w-36">
                  {{ currentLanguageSet?.inventory?.remarks }}
                </th>
                <th z-table-head></th>
              </tr>
            </thead>
            <tbody z-table-body>
              <tr
                z-table-row
                *ngFor="let element of dataSource.data; let i = index"
                [formGroup]="element"
              >
                <td z-table-cell>{{ i + 1 }}</td>
                <td z-table-cell>
                  <div class="relative">
                    <input
                      z-input
                      class="w-full bg-background pr-9"
                      allowText="itemNameSearchValidator"
                      name="itemNameView"
                      formControlName="itemNameView"
                      maxlength="100"
                      appIndentRequest
                      [previousSelected]="
                        indentRequestForm?.value?.indentItemList
                      "
                      [itemListForm]="element"
                      required
                      placeholder="{{
                        currentLanguageSet?.inventory?.itemName
                      }}"
                      [attr.aria-label]="
                        currentLanguageSet?.inventory?.itemName
                      "
                    />
                    <button
                      type="button"
                      class="absolute right-2 top-1/2 inline-flex -translate-y-1/2 appearance-none items-center justify-center border-0 bg-transparent p-0 text-muted-foreground transition-colors hover:text-foreground focus-visible:text-foreground focus-visible:outline-none"
                      appIndentRequest
                      [previousSelected]="
                        indentRequestForm?.value?.indentItemList
                      "
                      [itemListForm]="element"
                      aria-label="Search item"
                    >
                      <ng-icon name="lucideSearch" size="18"></ng-icon>
                    </button>
                  </div>
                </td>
                <td z-table-cell>
                  <input
                    z-input
                    class="w-full bg-background"
                    allowText="number"
                    name="qOH"
                    formControlName="qOH"
                    required
                    placeholder="{{
                      currentLanguageSet?.inventory?.quantityOnHand
                    }}"
                    [attr.aria-label]="
                      currentLanguageSet?.inventory?.quantityOnHand
                    "
                  />
                </td>
                <td z-table-cell>
                  <input
                    z-input
                    class="w-full bg-background"
                    allowText="number"
                    name="requiredQty"
                    formControlName="requiredQty"
                    [attr.maxlength]="('' + element.qOH).length"
                    (blur)="checkQuantity(element)"
                    required
                    placeholder="{{
                      currentLanguageSet?.inventory?.requiredQuantity
                    }}"
                    [attr.aria-label]="
                      currentLanguageSet?.inventory?.requiredQuantity
                    "
                  />
                </td>
                <td z-table-cell>
                  <input
                    z-input
                    class="w-full bg-background"
                    name="remarks"
                    formControlName="remarks"
                    allowText="alphanumericspace"
                    placeholder="{{ currentLanguageSet?.inventory?.remarks }}"
                    [attr.aria-label]="currentLanguageSet?.inventory?.remarks"
                  />
                </td>
                <td z-table-cell>
                  <button
                    z-button
                    zType="ghost"
                    zSize="icon-sm"
                    type="button"
                    class="text-destructive"
                    [zTooltip]="currentLanguageSet?.inventory?.delete"
                    [attr.aria-label]="
                      currentLanguageSet?.inventory?.delete || 'Delete'
                    "
                    (click)="removeFromindentItemList(i, element)"
                  >
                    <ng-icon name="lucideTrash2"></ng-icon>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div
          class="mt-3 flex justify-end px-2 pb-2"
          *ngIf="indentRequestForm.get('indentItemList')?.valid"
        >
          <button
            z-button
            zType="default"
            zSize="icon-sm"
            type="button"
            class="rounded-full"
            aria-label="Add item"
            (click)="addToindentItemList()"
          >
            <ng-icon name="lucidePlus"></ng-icon>
          </button>
        </div>
      </z-card-content>
    </z-card>

    <div class="mt-6 flex flex-wrap items-center justify-between gap-2">
      <button
        z-button
        zType="default"
        type="button"
        [zTooltip]="currentLanguageSet?.inventory?.back"
        zPosition="right"
        (click)="goBack()"
      >
        {{ currentLanguageSet?.inventory?.back }}
      </button>

      <div class="flex flex-wrap justify-end gap-2">
        <button
          z-button
          zType="outline"
          type="button"
          [disabled]="indentRequestForm.pristine"
          (click)="resetIndentRequestForm()"
        >
          {{ currentLanguageSet?.inventory?.clear }}
        </button>
        <button
          z-button
          zType="default"
          type="button"
          *ngIf="!editMode"
          [disabled]="indentRequestForm.invalid"
          (click)="submitIndentRequest(indentRequestForm)"
        >
          {{ currentLanguageSet?.common?.save }}
        </button>
        <button
          z-button
          zType="default"
          type="button"
          *ngIf="editMode"
          [disabled]="indentRequestForm.invalid"
          (click)="updateIndentRequest(indentRequestForm)"
        >
          {{ currentLanguageSet?.inventory?.update }}
        </button>
      </div>
    </div>
  </form>
</section>
