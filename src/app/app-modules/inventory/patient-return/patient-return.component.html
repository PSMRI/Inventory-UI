<div class="px-6 pb-10 pt-4">
  <form [formGroup]="patientReturnForm" autocomplete="off">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <p class="m-0 text-xl font-semibold tracking-tight text-foreground">
        {{ currentLanguageSet?.inventory?.patientReturns }}
      </p>
      <button
        z-button
        zType="outline"
        type="button"
        routerLink="previousRecord"
      >
        {{ currentLanguageSet?.inventory?.previousRecords }}
      </button>
    </div>

    <div
      class="mt-4 grid gap-4 md:grid-cols-2 lg:grid-cols-4"
      *ngIf="!benSelected"
    >
      <z-form-field class="gap-1.5">
        <label z-form-label zRequired for="beneficiaryIDOrPhoneNumber">{{
          currentLanguageSet?.inventory?.beneficiaryIDPhoneNumber
        }}</label>
        <z-form-control>
          <div class="relative">
            <input
              z-input
              class="w-full pr-9"
              id="beneficiaryIDOrPhoneNumber"
              required
              allowText="number"
              maxlength="12"
              name="beneficiaryIDOrPhoneNumber"
              formControlName="beneficiaryIDOrPhoneNumber"
              (keyup.enter)="identityQuickSearch(beneficiaryIDOrPhoneNumber)"
              placeholder="{{
                currentLanguageSet?.inventory?.beneficiaryIDPhoneNumber
              }}"
            />
            <button
              type="button"
              class="absolute right-2 top-1/2 inline-flex -translate-y-1/2 appearance-none items-center justify-center border-0 bg-transparent p-0 text-muted-foreground transition-colors hover:text-foreground focus-visible:text-foreground focus-visible:outline-none"
              aria-label="Search beneficiary"
              (click)="identityQuickSearch(beneficiaryIDOrPhoneNumber)"
            >
              <ng-icon name="lucideSearch" size="18"></ng-icon>
            </button>
          </div>
        </z-form-control>
      </z-form-field>
    </div>

    <div
      class="mt-4 grid gap-4 md:grid-cols-2 lg:grid-cols-4"
      *ngIf="benSelected"
    >
      <z-form-field class="gap-1.5">
        <label z-form-label for="beneficiaryID">{{
          currentLanguageSet?.bendetails?.beneficiaryID
        }}</label>
        <z-form-control>
          <input
            z-input
            class="w-full"
            autocomplete="off"
            maxlength="100"
            name="beneficiaryID"
            id="beneficiaryID"
            formControlName="beneficiaryID"
            placeholder="{{ currentLanguageSet?.bendetails?.beneficiaryID }}"
          />
        </z-form-control>
      </z-form-field>

      <z-form-field class="gap-1.5">
        <label z-form-label for="name">{{
          currentLanguageSet?.bendetails?.beneficiaryName
        }}</label>
        <z-form-control>
          <input
            z-input
            class="w-full"
            autocomplete="off"
            maxlength="100"
            name="name"
            id="name"
            formControlName="name"
            placeholder="{{ currentLanguageSet?.bendetails?.beneficiaryName }}"
          />
        </z-form-control>
      </z-form-field>

      <z-form-field class="gap-1.5">
        <label z-form-label for="age">{{
          currentLanguageSet?.bendetails?.age
        }}</label>
        <z-form-control>
          <input
            z-input
            class="w-full"
            autocomplete="off"
            maxlength="100"
            name="age"
            id="age"
            formControlName="age"
            placeholder="{{ currentLanguageSet?.bendetails?.age }}"
          />
        </z-form-control>
      </z-form-field>

      <z-form-field class="gap-1.5">
        <label z-form-label for="gender">{{
          currentLanguageSet?.bendetails?.gender
        }}</label>
        <z-form-control>
          <input
            z-input
            class="w-full"
            autocomplete="off"
            maxlength="100"
            name="gender"
            id="gender"
            formControlName="gender"
            placeholder="{{ currentLanguageSet?.bendetails?.gender }}"
          />
        </z-form-control>
      </z-form-field>
    </div>

    <div class="mt-6" *ngIf="benSelected">
      <app-item-batch-details-for-patient-return
        [itemMasterList]="itemMasterList"
        [benRegId]="benRegId"
        (resetBenDetails)="resetBenDetails($event)"
      ></app-item-batch-details-for-patient-return>
    </div>
  </form>
</div>
