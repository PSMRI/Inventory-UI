<div
  class="flex min-h-svh w-full flex-col items-center justify-center gap-6 bg-muted p-6 md:p-10"
  (mouseup)="hidePWD()"
>
  <z-card class="w-full max-w-sm">
    <z-card-header class="flex flex-col items-center gap-1.5 text-center">
      <img
        class="mb-2 h-12 w-auto"
        src="assets/images/Swasthya.png"
        alt="Piramal Swasthya"
      />
      <z-card-title>Account Support</z-card-title>
      <z-card-description
        >Follow the steps to change/reset the password</z-card-description
      >
    </z-card-header>

    <z-card-content class="grid gap-6">
      <form #passwordFields="ngForm" class="grid gap-6" autocomplete="off">
        <z-form-field>
          <label z-form-label zRequired for="newpwd">New Password</label>
          <z-form-control>
            <div class="relative">
              <ng-icon
                class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground"
                name="lucideLock"
                size="18"
                aria-hidden="true"
              ></ng-icon>
              <input
                z-input
                class="w-full pl-9 pr-10"
                autocomplete="off"
                [type]="dynamictype"
                id="newpwd"
                [(ngModel)]="newpwd"
                name="newpwd"
                required
                placeholder="Enter new password"
              />
              <button
                type="button"
                class="absolute right-3 top-1/2 inline-flex -translate-y-1/2 items-center justify-center appearance-none border-0 bg-transparent p-0 text-muted-foreground transition-colors hover:text-foreground focus-visible:outline-none focus-visible:text-foreground"
                aria-label="Show password while pressed"
                (mousedown)="showPWD()"
              >
                <ng-icon
                  [name]="dynamictype === 'text' ? 'lucideEyeOff' : 'lucideEye'"
                  size="18"
                ></ng-icon>
              </button>
            </div>
          </z-form-control>
        </z-form-field>

        <z-form-field>
          <label z-form-label zRequired for="confirmpwd"
            >Confirm Password</label
          >
          <z-form-control>
            <div class="relative">
              <ng-icon
                class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground"
                name="lucideLock"
                size="18"
                aria-hidden="true"
              ></ng-icon>
              <input
                z-input
                class="w-full pl-9 pr-10"
                autocomplete="off"
                [type]="dynamictype"
                id="confirmpwd"
                [(ngModel)]="confirmpwd"
                name="confirmpwd"
                required
                placeholder="Re-enter new password"
              />
              <button
                type="button"
                class="absolute right-3 top-1/2 inline-flex -translate-y-1/2 items-center justify-center appearance-none border-0 bg-transparent p-0 text-muted-foreground transition-colors hover:text-foreground focus-visible:outline-none focus-visible:text-foreground"
                aria-label="Show password while pressed"
                (mousedown)="showPWD()"
              >
                <ng-icon
                  [name]="dynamictype === 'text' ? 'lucideEyeOff' : 'lucideEye'"
                  size="18"
                ></ng-icon>
              </button>
            </div>
          </z-form-control>
        </z-form-field>
      </form>

      <button
        z-button
        type="button"
        zType="default"
        zFull
        [disabled]="!passwordFields.valid"
        (click)="updatePassword(newpwd)"
      >
        Change Password
      </button>
    </z-card-content>
  </z-card>
</div>
